    <rect x="180" y="152" width="224" height="104" fill="#ff5a5f"/>
    <rect x="180" y="256" width="224" height="104" fill="#f6f4fb"/>
  </g>
  <circle cx="292" cy="256" r="104" fill="none" stroke="#14121c" stroke-width="12"/>
  <rect x="188" y="248" width="208" height="16" fill="#14121c"/>
  <circle cx="292" cy="256" r="34" fill="#f6f4fb" stroke="#14121c" stroke-width="12"/>
