  <g fill="#14121c" stroke="#c9c3dd" stroke-width="10">
    <circle cx="124" cy="140" r="17"/><circle cx="124" cy="240" r="17"/><circle cx="124" cy="340" r="17"/>
  </g>
  <!-- pokeball -->
