<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ad7f0"/><stop offset=".4" stop-color="#b59cff"/><stop offset=".7" stop-color="#ff9ad5"/><stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="292" cy="256" r="104"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#14121c"/>
  <!-- page edge -->
  <rect x="112" y="84" width="316" height="344" rx="28" fill="#e9e5f4"/>
  <!-- cover -->
  <rect x="88" y="68" width="316" height="344" rx="28" fill="#2c2742"/>
